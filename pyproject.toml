[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "darsamooz"
version = "0.1.0"
description = "درس‌آموز — generate multiple-choice tests from Iranian textbook PDFs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Parsa Safapour" }]
dependencies = [
  "click>=8.1",
  "httpx>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
darsamooz = "darsamooz.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/darsamooz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
